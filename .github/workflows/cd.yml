name: CD

# Continuous delivery: publish container images to GHCR, then optionally deploy.
#
# Triggers:
#   - push to master        → build + push images tagged `edge` / `master` / <sha>, then deploy
#   - push of a v* tag       → build + push images tagged with the semver, `latest`, <sha>, then deploy
#   - manual (workflow_dispatch) → same as a master push, for re-runs / one-off deploys
#
# The deploy job is intentionally a no-op unless the deployment secrets are
# configured (see the `deploy` job). This lets image publishing work out of the
# box while keeping deployment opt-in and safe.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Images are published under ghcr.io/<owner>/<repo>/<component>.
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Build & push all three images to GHCR ─────────────────────
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: employeeapi
          - component: employeehub
            context: employeehub
          - component: hrdashboard
            context: hrdashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Frontends read the API URL at build time; override per environment
          # by setting the DEPLOY_API_URL repo/environment variable.
          build-args: |
            REACT_APP_API_URL=${{ vars.DEPLOY_API_URL || 'http://localhost:8080' }}

  # ── Deploy the freshly published images ───────────────────────
  # Runs over SSH against a host that has Docker + Docker Compose. It pulls the
  # images published above and brings the stack up with docker-compose.prod.yml.
  # Skipped automatically when DEPLOY_HOST is not configured.
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [publish]
    # Only deploy released code, never PRs or feature branches.
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Check deployment configuration
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::DEPLOY_HOST secret is not set. Images were published to GHCR but no server deploy was performed."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (for compose file)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Compute image tag to deploy
        if: steps.gate.outputs.enabled == 'true'
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          # Copy the production compose file to the server, then pull + up.
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            export REGISTRY="${REGISTRY}"
            export IMAGE_PREFIX="${IMAGE_PREFIX}"
            export IMAGE_TAG="${IMAGE_TAG}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
          EOF
