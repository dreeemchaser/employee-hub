name: CI

# Build and test the full EmployeeHub stack on every push and pull request.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Spring Boot / Maven ──────────────────────────────
  backend:
    name: Backend (employeeapi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employeeapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  # ── Employee frontend: Create React App ───────────────────────
  employeehub:
    name: Frontend (employeehub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employeehub
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: employeehub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false

  # ── HR dashboard: Create React App ────────────────────────────
  hrdashboard:
    name: Frontend (hrdashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrdashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hrdashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false

  # ── Docker: validate the full stack builds ────────────────────
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    # Only after the app jobs pass, so we fail fast on cheaper checks first.
    needs: [backend, employeehub, hrdashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build
