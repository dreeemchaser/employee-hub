spring:
  application:
    name: employee-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employeehub}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:administrator}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  sql:
    init:
      mode: always
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    # Adopt a database that already has the schema (e.g. an existing dev/prod DB
    # created under ddl-auto=update) by stamping the baseline instead of failing.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    generate-ddl: ${SPRING_JPA_GENERATE_DDL:false}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    # Flyway now owns the schema and runs before data.sql, so data.sql no longer
    # needs to defer until after Hibernate. Keeping defer-datasource-initialization
    # on with Flyway present creates a flyway <-> entityManagerFactory dependency
    # cycle at startup, so it is deliberately removed.
    hibernate:
      # Flyway owns the schema; Hibernate only validates that the entities match
      # the migrated schema and never mutates it. A mismatch fails startup — that
      # is intentional (it surfaces missing migrations early).
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
  mvc:
    async:
      request-timeout: 30000

server:
  port: ${SERVER_PORT:8080}
  error:
    path: /error
    whitelabel:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.web: DEBUG
    employeehub: DEBUG

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Access token lifetime (ms). Short-lived — the client silently renews it via the
  # refresh token. Default 15 min. Falls back to the legacy JWT_EXPIRATION override
  # if set, so existing deployments keep working.
  access-expiration: ${JWT_ACCESS_EXPIRATION:${JWT_EXPIRATION:900000}}
  # Refresh token lifetime (ms). Long-lived, server-tracked, rotated on use.
  # Default 7 days.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:${user.home}/employeehub/uploads/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  security:
    lockout:
      # Number of consecutive failed logins before an account is temporarily locked.
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      # How long (minutes) an account stays locked once the threshold is hit.
      duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    password-reset:
      # How long (minutes) a password reset token stays valid.
      token-ttl-minutes: ${AUTH_PASSWORD_RESET_TTL_MINUTES:30}
      # Dev/test only: when true, /auth/forgot-password returns the token in the
      # response body. MUST be false in production (the email delivers the token).
      expose-token: ${AUTH_PASSWORD_RESET_EXPOSE_TOKEN:false}
      # Front-end URL the reset link points to; the token is appended as ?token=.
      reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    # Email delivery is off unless MAIL_ENABLED=true and SMTP is configured below.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@employeehub.local}
